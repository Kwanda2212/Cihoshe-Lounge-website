<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Cihoshe Lounge — Manager Login">
<title>Cihoshe Lounge | Manager Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="/">Cihoshe <span>Lounge</span></a>
  <button class="menu-toggle" aria-label="Open navigation" aria-expanded="false">☰</button>
  <nav class="nav" id="mainNav">
    <a href="/">Home</a><a href="/menu.html">Menu</a><a href="/reservations.html">Reservations</a><a href="/feedback.html">Feedback</a><a href="/contact.html">Contact</a><a href="/manager-login.html">Manager</a>
  </nav>
  <a class="nav-cta" href="/reservations.html">Reserve a table</a>
</header>
<main>
<section class="section dark-section">
  <div class="split">
    <div>
      <p class="eyebrow gold-text">MANAGER ACCESS</p>
      <h2>Secure staff login</h2>
      <p>Only authorised management can access the dashboard and reservation data.</p>

    </div>
    <form id="managerLoginForm" class="form-card">
      <h3>Manager login</h3>
      <div class="form-grid">
        <label>Email<input name="email" type="email" required></label>
        <label>Password
          <div class="password-wrap">
            <input name="password" type="password" required id="passwordInput">
            <button type="button" class="password-toggle" aria-label="Show password" id="passwordToggle">
              <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg id="eyeOffIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </label>
      </div>
      <button class="btn gold full" type="submit">Sign in</button>
      <p class="form-message" id="managerMessage"></p>
    </form>
  </div>
</section>
</main>
<footer><div class="brand">Cihoshe <span>Lounge</span></div><p>Luxury African dining, thoughtfully presented.</p><p>© <span id="year"></span> Cihoshe Lounge</p></footer>
<div id="toast" class="toast" role="status"></div>
<script src="/app.js"></script>
</body>
</html>
